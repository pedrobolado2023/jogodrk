server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # /privado -> /privado/ with a relative redirect (behind Easypanel's HTTPS proxy an absolute one would say http://)
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $cache_control always;

    set $cache_control "no-cache";

    location /assets/ {
        set $cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/sprites/.*\.png$ {
        set $cache_control "public, max-age=300";
        try_files $uri =404;
    }

    location = /sprites/manifest.json {
        set $cache_control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        set $cache_control "no-cache";
        try_files $uri =404;
    }

    # admin panel: never cached, never indexed (the server checks the admin account on every request)
    location /privado/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /privado/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
